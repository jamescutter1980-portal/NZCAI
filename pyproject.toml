[project]
name = "nzcai-mcp"
version = "0.1.0"
description = "MCP layer for the NZC / ESG AI app — domain tools exposed to MCP clients."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    # starlette.testclient drives the wired ASGI app, auth included.
    "httpx>=0.27",
]

[project.scripts]
nzcai-mcp = "nzcai_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nzcai_mcp"]

# The UK NZCBS V1 Rev 1 reference tables ship inside the wheel so the MCP layer
# reads the same checksummed files as the portal (reference/uk-nzcbs/<version>/).
[tool.hatch.build.targets.wheel.force-include]
"reference/uk-nzcbs" = "nzcai_mcp/bundled_reference/uk-nzcbs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
