services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nzcai
      POSTGRES_PASSWORD: nzcai
      POSTGRES_DB: nzcai
    ports:
      - "5432:5432"
    volumes:
      - nzcai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nzcai -d nzcai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nzcai_pgdata:
