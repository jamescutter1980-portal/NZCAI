services:
  # Long-lived HTTP transport: one service many clients connect to. This is the
  # shape the portal uses. For the stdio shape the client spawns the container
  # itself -- see README.
  mcp:
    build: .
    image: nzcai-mcp:dev
    environment:
      NZCAI_MCP_TRANSPORT: http
      NZCAI_MCP_HOST: 0.0.0.0
      NZCAI_MCP_PORT: 8080
      NZCAI_DATA_DIR: /data
      # Where the DESNZ flat file is read from. Same variable the portal uses.
      # Defaults to <NZCAI_DATA_DIR>/reference, which the mount below covers.
      REFERENCE_DATA_DIR: ${REFERENCE_DATA_DIR:-}
      # Host header allowlist for DNS-rebinding protection. The container binds
      # 0.0.0.0, for which the SDK applies no default, so this is the only guard.
      NZCAI_MCP_ALLOWED_HOSTS: ${NZCAI_MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
      # Shared bearer token. The server refuses to start on HTTP without it unless
      # NZCAI_MCP_ALLOW_ANONYMOUS is set, so put one in .env:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      NZCAI_MCP_AUTH_TOKEN: ${NZCAI_MCP_AUTH_TOKEN:-}
      NZCAI_MCP_ALLOW_ANONYMOUS: ${NZCAI_MCP_ALLOW_ANONYMOUS:-}
    ports:
      # Loopback only by default. The bearer token is the access control; a
      # reverse proxy terminating TLS is still wanted before this leaves the host,
      # since a bearer token on plain HTTP is readable in transit.
      - "127.0.0.1:8080:8080"
    volumes:
      # data/reference (DESNZ factors, CRREM pathways, NZCBS limits), read-only:
      # the server never writes reference data.
      - ./data:/data:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
