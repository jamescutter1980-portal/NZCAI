# Site Intelligence source registry.
#
# Brief section 3.4: "Copy the exact wording from each source's licence page.
# Store it in sources.yaml, not hard-coded."
#
# Attribution strings below are TRANSCRIBED FROM MEMORY OF THE LICENCE PAGES and
# have NOT been checked against the live pages — this build had no network
# access to them. Before anything ships to a client, open each `licence_url` and
# confirm the string character for character. {year} is substituted at render
# time with the current year.
#
# Any dataset whose licence does not permit commercial reuse must be removed
# from here, logged in docs/site-intel/PLAN.md, and raised with James.

sources:
  os-open-uprn:
    name: OS Open UPRN
    publisher: Ordnance Survey
    dataset: OpenUPRN
    kind: bulk
    url: https://api.os.uk/downloads/v1/products/OpenUPRN
    licence: OGL-UK-3.0
    licence_url: https://www.ordnancesurvey.co.uk/licensing/open-data-licence
    attribution: "Contains OS data © Crown copyright and database right {year}"
    attribution_verified: false
    refresh: quarterly
    notes: >
      ~40M points. Authoritative source of persisted coordinates. Brief section
      3.1: stored coordinates must always come from here, never from Google.

  os-code-point-open:
    name: OS Code-Point Open
    publisher: Ordnance Survey
    dataset: CodePointOpen
    kind: bulk
    url: https://api.os.uk/downloads/v1/products/CodePointOpen
    licence: OGL-UK-3.0
    licence_url: https://www.ordnancesurvey.co.uk/licensing/open-data-licence
    attribution: "Contains OS data © Crown copyright and database right {year}"
    attribution_verified: false
    refresh: quarterly
    notes: Postcode centroids. Approximate only - the user must pin the building.

  os-openmap-local:
    name: OS OpenMap Local
    publisher: Ordnance Survey
    dataset: OpenMapLocal
    kind: bulk
    url: https://api.os.uk/downloads/v1/products/OpenMapLocal
    licence: OGL-UK-3.0
    licence_url: https://www.ordnancesurvey.co.uk/licensing/open-data-licence
    attribution: "Contains OS data © Crown copyright and database right {year}"
    attribution_verified: false
    refresh: biannual
    notes: Building polygons for footprints. Requires PostGIS.

  planning-data-title-boundary:
    name: Title boundary (HM Land Registry index polygons)
    publisher: Ministry of Housing, Communities and Local Government
    dataset: title-boundary
    kind: api
    url: https://www.planning.data.gov.uk/entity.json
    licence: OGL-UK-3.0
    licence_url: https://www.planning.data.gov.uk/dataset/title-boundary
    # Title polygons need BOTH statements - brief section 3.4.
    attribution: >-
      © Crown copyright and database right {year}. This data is licensed under
      the Open Government Licence v3.0. The polygons (including the associated
      geometry, namely x, y co-ordinates) are subject to Crown copyright and
      database rights {year} Ordnance Survey AC0000851063.
    attribution_verified: false
    refresh: 7d
    coverage: England
    notes: >
      ~22.7M entities, marked incomplete by the publisher. A point returning no
      polygon therefore means not_found_coverage_unknown, never "no title".

  planning-data-lpa:
    name: Local planning authority
    publisher: Ministry of Housing, Communities and Local Government
    dataset: local-planning-authority
    kind: api
    url: https://www.planning.data.gov.uk/entity.json
    licence: OGL-UK-3.0
    licence_url: https://www.planning.data.gov.uk/dataset/local-planning-authority
    attribution: "Contains public sector information licensed under the Open Government Licence v3.0"
    attribution_verified: false
    refresh: 7d
    coverage: England

  epc-register:
    name: Energy Performance of Buildings register
    publisher: Ministry of Housing, Communities and Local Government
    dataset: epc-non-domestic
    kind: api
    url: https://get-energy-performance-data.communities.gov.uk
    licence: custom-epc
    licence_url: https://epc.opendatacommunities.org/docs/copyright
    attribution: "Contains public sector information licensed under the Open Government Licence v3.0"
    attribution_verified: false
    refresh: 30d
    notes: >
      Address -> UPRN, the only step that yields an `exact` match. Registration
      required for an API key. The legacy epc.opendatacommunities.org endpoint
      has no published retirement date; this is the current host. NOT YET
      IMPLEMENTED - no register retrieval module exists in this repo (Task 0).

  google-geocoding:
    name: Google Geocoding API
    publisher: Google
    dataset: geocoding
    kind: api
    url: https://maps.googleapis.com/maps/api/geocode/json
    licence: google-maps-platform-tos
    licence_url: https://cloud.google.com/maps-platform/terms
    attribution: "Geocoding by Google"
    attribution_verified: false
    refresh: none
    persist_coordinates: false
    notes: >
      Fallback only, and its coordinates are NEVER persisted. Used solely to
      find candidate OS Open UPRN points within 25 m, which are what gets
      stored. Brief section 3.1.

  planning-data-constraints:
    name: Planning and environmental constraints
    publisher: Ministry of Housing, Communities and Local Government
    dataset: planning-data-constraints
    kind: api
    url: https://www.planning.data.gov.uk/entity.json
    licence: OGL-UK-3.0
    licence_url: https://www.planning.data.gov.uk/docs
    attribution: "Contains public sector information licensed under the Open Government Licence v3.0"
    attribution_verified: false
    refresh: 7d
    coverage: England
    notes: >
      Covers every S-02 constraint dataset. Coverage varies by dataset and by
      local planning authority and is not guaranteed complete, which is why an
      empty result is not_found_coverage_unknown rather than a plain not-found.

  ea-flood-map:
    name: Flood Map for Planning (Rivers and Sea)
    publisher: Environment Agency
    dataset: flood-map-for-planning
    kind: api
    url: https://environment.data.gov.uk/spatialdata/flood-map-for-planning-rivers-and-sea-flood-zone-3/wfs
    licence: OGL-UK-3.0
    licence_url: https://environment.data.gov.uk/
    attribution: "© Environment Agency copyright and/or database right {year}. All rights reserved."
    attribution_verified: false
    refresh: 30d
    coverage: England
    notes: >
      The authoritative flood source; planning.data carries a copy. Where the
      two disagree both are shown and source_conflict is raised. Surface-water
      flood risk is out of scope for phase 1. ENDPOINT SHAPE UNVERIFIED - this
      build could not reach environment.data.gov.uk.

  hmlr-ccod:
    name: UK companies that own property in England and Wales (CCOD)
    publisher: HM Land Registry
    dataset: ccod
    kind: bulk
    url: https://use-land-property-data.service.gov.uk/datasets/ccod
    licence: hmlr-ccod-licence
    licence_url: https://use-land-property-data.service.gov.uk/datasets/ccod/licence
    attribution: >-
      Contains HM Land Registry data © Crown copyright and database right {year}.
      This data is licensed under the Open Government Licence v3.0.
    attribution_verified: false
    refresh: 30d
    coverage: England and Wales
    notes: >
      Keyed by title number, with the property address as free text. Registration
      and licence acceptance required before download. CHECK THE LICENCE TERMS
      BEFORE ANY COMMERCIAL USE - CCOD is not plain OGL and carries conditions on
      redistribution.

  hmlr-ocod:
    name: Overseas companies that own property in England and Wales (OCOD)
    publisher: HM Land Registry
    dataset: ocod
    kind: bulk
    url: https://use-land-property-data.service.gov.uk/datasets/ocod
    licence: hmlr-ocod-licence
    licence_url: https://use-land-property-data.service.gov.uk/datasets/ocod/licence
    attribution: >-
      Contains HM Land Registry data © Crown copyright and database right {year}.
      This data is licensed under the Open Government Licence v3.0.
    attribution_verified: false
    refresh: 30d
    coverage: England and Wales
    notes: >
      As CCOD, plus country of incorporation. Same licence caution applies.

  hmlr-national-polygon:
    name: National Polygon Service
    publisher: HM Land Registry
    dataset: national-polygon
    kind: bulk
    url: https://use-land-property-data.service.gov.uk/datasets/nps
    licence: hmlr-nps-commercial
    licence_url: https://use-land-property-data.service.gov.uk/datasets/nps/licence/view
    attribution: >-
      Contains HM Land Registry data © Crown copyright and database right {year}.
    attribution_verified: false
    refresh: quarterly
    coverage: England and Wales
    notes: >
      NOT LICENSED, NOT IN USE. £20,000 per year. This is the only dataset that
      links a polygon to a title number, and therefore the only way to turn an
      address match into a definitive owner. Everything in S-04 is inferred
      because we do not hold it. Listed here so the gap is explicit.

  companies-house:
    name: Companies House public data
    publisher: Companies House
    dataset: company-information
    kind: api
    url: https://api.company-information.service.gov.uk
    licence: OGL-UK-3.0
    licence_url: https://developer.company-information.service.gov.uk/
    attribution: "Contains public sector information licensed under the Open Government Licence v3.0"
    attribution_verified: false
    refresh: 7d
    notes: >
      Free with a registered API key (COMPANIES_HOUSE_API_KEY). Supplies company
      status, registered address, officers and persons with significant control.
      Without a key, ownership screening still runs and reports company details
      as unavailable.

  voa-rating-list:
    name: VOA compiled rating list and summary valuations
    publisher: Valuation Office Agency
    dataset: non-domestic-rating-list
    kind: bulk
    url: https://voaratinglists.blob.core.windows.net/html/rlidata.htm
    licence: OGL-UK-3.0
    licence_url: https://www.gov.uk/government/organisations/valuation-office-agency
    attribution: >-
      Contains public sector information from the Valuation Office Agency
      licensed under the Open Government Licence v3.0.
    attribution_verified: false
    refresh: quarterly
    coverage: England and Wales
    notes: >
      ASTERISK-DELIMITED despite the .csv extension. Two files: the compiled list
      (assessments, rateable values, primary descriptions) and the summary
      valuations (survey lines carrying floor areas and their measurement basis).
      Carries VOA's UARN, NOT a UPRN, so matching to a site is by address and
      always inferred. Column positions in the loader follow the published data
      specification but have NOT been checked against a real file.

  os-addressbase-premium:
    name: OS AddressBase Premium
    publisher: Ordnance Survey
    dataset: AddressBasePremium
    kind: bulk
    url: https://www.ordnancesurvey.co.uk/products/os-addressbase-premium
    licence: os-commercial
    licence_url: https://www.ordnancesurvey.co.uk/licensing
    attribution: "Contains OS data © Crown copyright and database right {year}"
    attribution_verified: false
    refresh: quarterly
    notes: >
      NOT LICENSED, NOT IN USE. Paid OS product. It is the only source of the
      UPRN-to-VOA cross reference, so holding it would turn every S-06 address
      match into a definitive link. Listed so the gap is explicit, alongside the
      National Polygon Service gap in S-04.

